name: release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            os: linux
            arch: amd64
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
            os: linux
            arch: arm64
            archive: tar.gz
          - target: x86_64-apple-darwin
            runner: macos-latest
            os: darwin
            arch: amd64
            archive: tar.gz
          - target: aarch64-apple-darwin
            runner: macos-latest
            os: darwin
            arch: arm64
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            os: windows
            arch: amd64
            archive: zip
          - target: aarch64-pc-windows-msvc
            runner: windows-latest
            os: windows
            arch: arm64
            archive: zip
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Install Linux cross linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Test
        run: cargo test

      - name: Build
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --release --target "${{ matrix.target }}"

      - name: Stage binary
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          OS: ${{ matrix.os }}
        run: |
          set -euo pipefail
          mkdir -p dist
          BIN="md"
          if [ "${OS}" = "windows" ]; then
            BIN="md.exe"
          fi
          cp "target/${TARGET}/release/${BIN}" "dist/${BIN}"

      - name: Package
        shell: bash
        env:
          OS: ${{ matrix.os }}
          ARCH: ${{ matrix.arch }}
          ARCHIVE: ${{ matrix.archive }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          NAME="md_${VERSION}_${OS}_${ARCH}"

          if [ "${OS}" = "windows" ]; then
            (cd dist && zip -9 "../${NAME}.zip" "md.exe")
            echo "ASSET=${NAME}.zip" >> "$GITHUB_ENV"
          else
            (cd dist && tar -czf "../${NAME}.tar.gz" "md")
            echo "ASSET=${NAME}.tar.gz" >> "$GITHUB_ENV"
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET }}
          path: ${{ env.ASSET }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cd dist
          sha256sum md_${VERSION}_* > md_${VERSION}_checksums.txt

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
          generate_release_notes: true
