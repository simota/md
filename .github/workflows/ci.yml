name: ci

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --check
      - run: cargo test

      - name: Build smoke
        run: |
          set -euo pipefail
          cargo build --release
          file target/release/md
          target/release/md --help
